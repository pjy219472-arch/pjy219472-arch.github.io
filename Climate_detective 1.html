<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기후변화 탐정: 지역마다 기후변화의 영향은 왜 다르게 나타날까?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="appcss">
:root{--bg:#E6E8E1;--paper:#F6F6F2;--card:#FFFFFF;--ink:#1D2330;--muted:#585F6E;--line:#C5C8BD;--folder:#D5BB80;--folder-ink:#3D300F;--stamp:#A3302A;--teal:#2A6165;--teal-bg:#E3EFEE;--amber:#84600D;--amber-bg:#FAF2DF;--note:#FFFCF0;--note-line:#E9DFC0;--mat:#EEF1F2;--mat-head:#3E4A55;--field:#FFFFFF;--focus:#2A6165;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171D;--paper:#1B1F27;--card:#222733;--ink:#E7E5DE;--muted:#A6ACB8;--line:#3A404D;--folder:#8A7543;--folder-ink:#F5EBCF;--stamp:#E27C72;--teal:#7FC4C1;--teal-bg:#1D3132;--amber:#E3BA5E;--amber-bg:#30291A;--note:#25231C;--note-line:#3E3929;--mat:#1E232C;--mat-head:#9FB0BE;--field:#191D25;--focus:#7FC4C1;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171D;--paper:#1B1F27;--card:#222733;--ink:#E7E5DE;--muted:#A6ACB8;--line:#3A404D;--folder:#8A7543;--folder-ink:#F5EBCF;--stamp:#E27C72;--teal:#7FC4C1;--teal-bg:#1D3132;--amber:#E3BA5E;--amber-bg:#30291A;--note:#25231C;--note-line:#3E3929;--mat:#1E232C;--mat-head:#9FB0BE;--field:#191D25;--focus:#7FC4C1;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
h1,h2,h3,.serif{font-family:'Gowun Batang','Nanum Myeongjo','Batang',serif;line-height:1.35;font-weight:700}
h1{font-size:clamp(1.6rem,3.4vw,2.3rem);margin:.2em 0 .4em}
h2{font-size:1.35rem;margin:0 0 .5em}
h3{font-size:1.1rem;margin:0 0 .4em}
p{margin:.4em 0}
a{color:var(--teal)}
img,svg{max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding:0 18px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 18px;max-width:1360px;margin:0 auto}
.brand{font-family:'Gowun Batang',serif;font-weight:700;font-size:1.1rem;background:none;border:0;padding:4px 0;cursor:pointer;color:var(--ink);white-space:nowrap}
.track{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.track button{flex:1 0 auto;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 10px;font-size:.86rem;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap;color:var(--muted)}
.track button .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;font-size:.75rem;font-weight:700}
.track button[aria-current="step"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.track button.done .n{background:var(--teal);color:#fff;border-color:var(--teal)}
.track button:disabled{opacity:.45;cursor:not-allowed}
.teamchip{font-size:.85rem;color:var(--muted);white-space:nowrap}
.teamchip b{color:var(--ink)}
main{padding:22px 0 80px}

/* 홈 */
.home{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr) minmax(0,1fr);grid-template-areas:"intro map cards" "cmp cmp cmp";gap:20px;align-items:start}
.home .intro{grid-area:intro}.home .mapbox{grid-area:map}.home .cards{grid-area:cards;display:flex;flex-direction:column;gap:14px}.home .cmp{grid-area:cmp}
.notice{border-left:4px solid var(--stamp);background:var(--card);padding:14px 16px;margin:12px 0 16px;font-size:1.02rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
.panel+.panel{margin-top:14px}
.mapbox .panel{padding:8px}
.mapbox svg .mk{cursor:pointer}
.mapbox svg .mk:hover rect.lab,.mapbox svg .mk:focus rect.lab{stroke-width:4}
.maphint{font-size:.88rem;color:var(--muted);text-align:center;margin:6px 0 0}
.case-card{position:relative;display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:4px 14px 8px 8px;padding:12px;cursor:pointer;color:var(--ink)}
.case-card:hover{border-color:var(--c)}
.case-card .ic{width:132px;height:100px;border-radius:6px;overflow:hidden;background:#fff;display:block}
.case-card .ic img{width:100%;height:100%;object-fit:cover;display:block}
.case-card .cc-code{font-size:.85rem;color:var(--muted);font-weight:600}
.case-card .cc-title{font-family:'Gowun Batang',serif;font-weight:700;font-size:1.18rem;line-height:1.35;margin:2px 0 6px;display:block}
.stamp{display:inline-block;border:2px solid currentColor;border-radius:4px;padding:0 8px;font-size:.78rem;font-weight:700;transform:rotate(-4deg)}
.st-prog{color:var(--amber)}.st-done{color:var(--stamp)}
.mine{position:absolute;top:-6px;right:10px;background:var(--folder);color:var(--folder-ink);font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:0 0 6px 6px}
.field-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],textarea,select{background:var(--field);border:1.5px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;color:var(--ink)}
textarea{min-height:96px;resize:vertical;field-sizing:content;line-height:1.65}
input:focus,textarea:focus,select:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 25%,transparent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:6px;font-weight:600;cursor:pointer;text-decoration:none;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:6px 12px;min-height:36px;font-size:.9rem}
.btn.warn{border-color:var(--stamp);background:transparent;color:var(--stamp)}
.btn:disabled{opacity:.5;cursor:wait}
.muted{color:var(--muted)}.small{font-size:.88rem}
details summary{cursor:pointer;font-weight:600}
details.teach{margin-top:8px;font-size:.85rem;border-top:1px dashed var(--line);padding-top:6px}

/* 사건 화면 */
.case-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.case-head .ic{width:96px;height:72px;border-radius:8px;overflow:hidden;background:#fff;flex:none;border:1px solid var(--line)}
.case-head .ic img{width:100%;height:100%;object-fit:cover}
.case-head h1{margin:0;font-size:clamp(1.35rem,2.6vw,1.9rem)}
.case-head .sub{color:var(--muted);font-size:.92rem}
.case-head .tools{margin-left:auto;display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.case-head select{width:auto}
.step-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:16px}
.step-title h2{margin:0}
.split{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(340px,1fr);gap:22px;align-items:start}
.colhead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.95rem;margin:0 0 10px;padding:6px 12px;border-radius:6px}
.colhead.m{background:var(--mat-head);color:#fff}
.colhead.n{background:var(--amber);color:#fff}
.mat{display:flex;flex-direction:column;gap:18px}
.fig{margin:0;background:var(--mat);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fig-art{background:#fff;padding:10px;border-bottom:1px solid var(--line)}
.fig-art.two{display:grid;grid-template-columns:.8fr 1.2fr;gap:10px;align-items:center}
.fig-art .photo{width:100%;max-height:440px;object-fit:cover;display:block;border-radius:4px}
.fig figcaption{padding:12px 16px 14px;font-size:.93rem}
.fig-head{padding:10px 16px;font-weight:700;font-size:1.06rem;border-bottom:1px solid var(--line);background:var(--mat)}
.ev-items .cat{display:inline-block;font-size:.72rem;font-weight:700;border-radius:4px;padding:0 6px;margin-bottom:2px;color:#fff}
.cat-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.82rem;margin:4px 0}
.fig .ft{font-weight:700;font-size:1.05rem}
.fig .tag{display:inline-block;font-size:.75rem;font-weight:700;color:var(--mat-head);border:1px solid var(--mat-head);border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:2px}
.src{font-size:.8rem;color:var(--muted);margin-top:6px}
.badge{display:inline-block;font-size:.74rem;font-weight:700;border-radius:4px;padding:1px 7px;margin:4px 6px 0 0;border:1px solid currentColor}
.b-num{color:var(--stamp)}.b-check{color:var(--amber)}.b-concept{color:#6B5AA0}.b-real{color:var(--teal)}
.look{margin-top:8px;padding:8px 10px;border-radius:6px;background:var(--card);border:1px dashed var(--line);font-size:.92rem}
.look b{color:var(--mat-head)}
.memo{background:var(--mat);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.memo ul{margin:6px 0 0;padding-left:1.2em}.memo li{margin:4px 0}
.term{border:0;background:none;padding:0;color:inherit;font:inherit;border-bottom:2px dotted var(--teal);cursor:help}
.guide{background:var(--mat);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.92rem}
.guide ol{margin:6px 0;padding-left:1.3em}
.ev-items{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:8px 0}
.ev-items div{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:.92rem;background:var(--card)}
.factbox{font-size:1rem;background:var(--card);border-radius:6px;padding:12px 14px;border:1px solid var(--line)}

/* 수사 노트(학생 작성) */
.notes{position:sticky;top:96px;max-height:calc(100vh - 110px);overflow:auto;background:var(--note);border:2px solid var(--amber);border-radius:10px;padding:0 0 14px}
.notes .colhead{position:sticky;top:0;z-index:2;border-radius:0;margin:0 0 4px}
.nq{padding:10px 14px;border-bottom:1px dashed var(--note-line)}
.nq:last-child{border-bottom:0}
.q-head{display:flex;gap:6px;align-items:center;margin-bottom:2px;font-size:.78rem;font-weight:700;flex-wrap:wrap}
.kind{padding:1px 8px;border-radius:20px;background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber)}
.req{color:var(--stamp)}.opt{color:var(--muted)}
.nq label.ql{display:block;font-weight:600;line-height:1.5}
.hint{font-size:.84rem;color:var(--muted);margin:2px 0 6px}
.notes textarea{background:var(--field);border-color:var(--note-line)}
.chip{border:1px dashed var(--amber);background:transparent;color:var(--amber);border-radius:20px;padding:1px 10px;font-size:.78rem;cursor:pointer;margin-left:auto}
.chip:hover{background:var(--amber-bg)}
.starl{display:flex;gap:6px;align-items:center;font-size:.85rem;margin-top:4px;color:var(--stamp);font-weight:600}
.navbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:26px;border-top:1px solid var(--line);padding-top:16px;align-items:center}
.count{font-size:.88rem;color:var(--muted)}.count b{color:var(--ink)}
.tool .out{font-weight:700;font-size:1.05rem;margin-top:8px;padding:8px 10px;border-radius:6px;background:var(--teal-bg)}
input[type=range]{width:100%;accent-color:var(--teal)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.recap{background:var(--mat);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:.94rem}
.recap h3{font-size:1rem;font-family:'IBM Plex Sans KR',sans-serif}
.recap .empty{color:var(--muted);font-style:italic}
.preview{margin-top:18px;overflow-x:auto;background:#8F959B;padding:16px;border-radius:8px}
.preview .pg{margin:0 auto 16px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.status{margin-top:10px;font-weight:600;min-height:1.6em}
.cmp-table{width:100%;border-collapse:collapse;font-size:.92rem}
.cmp-table th,.cmp-table td{border:1px solid var(--line);padding:8px;vertical-align:top;background:var(--card)}
.cmp-table th{background:var(--paper);text-align:left}
.cmp-table textarea{min-height:70px}
.ref{font-size:.82rem;color:var(--muted);margin-top:4px;white-space:pre-wrap}
.tablewrap{overflow-x:auto}
.checklist li{margin:3px 0;color:var(--stamp)}

/* 사건 팝업 */
.modal-back{position:fixed;inset:0;background:rgba(15,18,24,.62);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 14px 24px;overflow:auto}
.modal{background:var(--paper);border-radius:12px;max-width:900px;width:100%;overflow:hidden;border-top:8px solid var(--c);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.modal .hero{background:#fff;max-height:440px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.modal .hero img{width:100%;max-height:440px;object-fit:cover;display:block}
.modal .hero svg{width:100%;max-height:440px}
.modal .cap{font-size:.78rem;color:var(--muted);padding:4px 18px 0}
.modal .body{padding:16px 22px 22px}
.keyq{font-family:'Gowun Batang',serif;font-size:1.15rem;border:2px solid var(--ink);padding:12px 16px;background:var(--card);border-radius:4px}
.modal .close{float:right}
.tphoto{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:start;border-top:1px dashed var(--line);padding:10px 0}
.tphoto img,.tphoto .ph{width:120px;height:84px;object-fit:cover;border-radius:6px;background:var(--paper);border:1px solid var(--line);display:block}

#pop{position:fixed;z-index:60;max-width:300px;background:var(--ink);color:var(--paper);padding:10px 12px;border-radius:8px;font-size:.88rem;line-height:1.55;display:none;box-shadow:0 4px 16px rgba(0,0,0,.25)}
#pop b{display:block;margin-bottom:2px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:70;display:none;max-width:90vw}
#pdfStage{position:absolute;left:-12000px;top:0;width:800px}

@media (max-width:1100px){.home{grid-template-columns:1fr 1fr;grid-template-areas:"intro intro" "map cards" "cmp cmp"}}
@media (max-width:920px){.split{grid-template-columns:1fr}.notes{position:static;max-height:none}.fig-art.two{grid-template-columns:1fr}}
@media (max-width:700px){.home{grid-template-columns:1fr;grid-template-areas:"intro" "map" "cards" "cmp"}.grid2{grid-template-columns:1fr}.case-card{grid-template-columns:96px 1fr}.case-card .ic{width:96px;height:80px}.case-head .tools{margin-left:0}}
@media (prefers-reduced-motion:no-preference){.modal{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}}

/* ===== 수사 파일 쪽(A4) — 항상 밝은 색 ===== */
.pg{width:793px;height:1118px;padding:34px 38px 30px;background:#fff;color:#1D2330;position:relative;overflow:hidden;font-family:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:13px;line-height:1.65}
.pg-in{transform-origin:0 0}
.pg-foot{position:absolute;left:38px;right:38px;bottom:14px;display:flex;justify-content:space-between;font-size:10px;color:#777;border-top:1px solid #ddd;padding-top:4px}
.pg h1,.pg h2,.pg h3{font-family:'Gowun Batang','Batang',serif;color:#1D2330}
.pg h2{font-size:19px;margin:0 0 8px;border-bottom:2px solid #1D2330;padding-bottom:4px}
.pg h3{font-size:14px;margin:10px 0 6px}
.r-head{display:flex;align-items:center;gap:10px;border-bottom:1px solid #9AA0A6;padding-bottom:6px;margin-bottom:12px;font-size:11px;color:#555}
.r-tab{color:#fff;font-weight:700;padding:2px 10px;border-radius:4px}
.r-pg{margin-left:auto;font-weight:700;color:#1D2330}
.r-cover{border:2px solid #1D2330;padding:22px 24px;background:#FBFAF5;position:relative}
.r-cover-top{font-size:12px;font-weight:700;color:#555;border-bottom:1px solid #9AA0A6;padding-bottom:6px}
.r-cover-no{display:inline-block;margin-top:18px;background:#D5BB80;color:#3D300F;font-weight:700;padding:3px 12px;border-radius:6px 6px 0 0;font-size:14px}
.r-cover h1{font-size:30px;margin:4px 0 2px}
.r-q{font-family:'Gowun Batang',serif;font-size:14px;color:#333}
.r-cv{display:flex;gap:16px;margin-top:14px;align-items:stretch}
.r-cv-img{flex:0 0 300px;height:210px;border:1px solid #C5C8BD;border-radius:6px;overflow:hidden;background:#fff}
.r-cv-img img{width:100%;height:100%;object-fit:cover;display:block}
.r-meta{width:100%;border-collapse:collapse;font-size:12.5px}
.r-meta th,.r-meta td{border:1px solid #9AA0A6;padding:7px 9px;text-align:left}
.r-meta th{width:90px;background:#EEF0EA}
.r-stamp{position:absolute;right:26px;top:52px;border:3px solid #A3302A;color:#A3302A;font-weight:700;font-size:17px;padding:2px 12px;transform:rotate(-8deg);border-radius:6px}
.r-row{display:flex;gap:12px;align-items:flex-start;margin:8px 0}
.r-fig{flex:1 1 0;min-width:0;border:1px solid #C5C8BD;border-radius:6px;padding:6px;background:#F6F8F8}
.r-fig .t{font-weight:700;font-size:12px;margin-bottom:4px}
.r-fig .s{font-size:9.5px;color:#666;margin-top:4px;line-height:1.4}
.r-fig img.photo{width:100%;max-height:220px;object-fit:cover;display:block}
.r-col{flex:1;min-width:0}
.r-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.r-ans{border:1px solid #D9C88F;border-radius:6px;padding:7px 10px;margin:0 0 8px;background:#FFFCF0}
.r-ans .l{font-size:10.5px;font-weight:700;color:#84600D;margin-bottom:2px}
.r-ans.key{border:2px solid #A3302A;background:#FFF5F3}
.r-ans.key .l{color:#A3302A}
.r-mat{border:1px solid #C5C8BD;border-radius:6px;padding:7px 10px;margin:0 0 8px;background:#F1F4F5}
.r-mat .l{font-size:10.5px;font-weight:700;color:#3E4A55;margin-bottom:2px}
.r-empty{color:#999;font-style:italic}
.r-memo{font-size:11.5px;margin:2px 0 0;padding-left:1.2em}
.r-badge{display:inline-block;font-size:9px;font-weight:700;border:1px solid currentColor;border-radius:3px;padding:0 5px;margin-right:4px}
.r-tbl{width:100%;border-collapse:collapse;font-size:11px;margin:6px 0}
.r-tbl th,.r-tbl td{border:1px solid #9AA0A6;padding:5px 7px;vertical-align:top;text-align:left}
.r-tbl th{background:#EEF0EA}
.r-legend{font-size:10.5px;color:#555;margin:0 0 8px;display:flex;gap:12px;align-items:center}
.r-legend span{display:inline-flex;align-items:center;gap:4px}
.r-legend i{display:inline-block;width:14px;height:10px;border-radius:2px}
</style>

function chartData(id){const b=CHARTS[id];const o=TD[id]||{};return Object.assign({},b,{series:b.series.map((s,i)=>({name:s.name,values:s.values.map((v,j)=>{const ov=o[i+'_'+j];return (ov!==undefined&&ov!==''&&isFinite(+ov))?+ov:v})}))})}
function niceMax(m){const steps=[1,2,2.5,5,10];const p=Math.pow(10,Math.floor(Math.log10(m)));for(const s of steps){if(s*p>=m)return s*p}return 10*p}
const CASE_COLORS=['#C0533A','#2F5D8A'];
function barChart(id,hl){
 const d=chartData(id);hl=hl||[];
 const W=560,H=270,ml=52,mr=16,mt=40,mb=50;
 const all=d.series.flatMap(s=>s.values);const mn=d.min||0;const max=mn?Math.ceil((Math.max(...all)+1)/5)*5:niceMax(Math.max(...all)*1.12||1);
 const n=d.labels.length,gw=(W-ml-mr)/n,ns=d.series.length,bw=Math.min(56,gw*0.72/ns);
 const ph=H-mt-mb;
 let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(d.title)}" style="width:100%;height:auto;display:block" font-family="${SVGF}"><rect width="${W}" height="${H}" fill="#ffffff"/>`;
 const NT=mn?Math.round((max-mn)/((max-mn)>8?5:1)):4;for(let i=0;i<=NT;i++){const v=mn+(max-mn)*i/NT,y=mt+ph*(1-i/NT);s+=`<line x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}" stroke="${i?'#E2E4DE':'#555'}" stroke-width="1"/><text x="${ml-8}" y="${y+4}" text-anchor="end" font-size="12" fill="#555">${+v.toFixed(2)}</text>`}
 s+=`<text x="${ml-8}" y="${mt-16}" text-anchor="end" font-size="12" fill="#333" font-weight="700">(${esc(d.unit)})</text>`;
 d.labels.forEach((lab,i)=>{
  const cx=ml+gw*i+gw/2;
  d.series.forEach((se,k)=>{
   const v=se.values[i];const h=ph*(v-mn)/(max-mn);const x=cx-(bw*ns)/2+bw*k+2;const y=mt+ph-h;
   let col=ns>1?CASE_COLORS[k]:(hl.includes(i)?'#C0533A':'#8E9AA0');
   s+=`<rect x="${x}" y="${y}" width="${bw-4}" height="${Math.max(0,h)}" fill="${col}" rx="2"/>`;
   s+=`<text x="${x+(bw-4)/2}" y="${y-6}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1D2330">${v}</text>`;
  });
  s+=`<text x="${cx}" y="${H-mb+20}" text-anchor="middle" font-size="13" fill="#1D2330" font-weight="${hl.includes(i)?700:400}">${esc(lab)}</text>`;
 });
 if(ns>1){d.series.forEach((se,k)=>{const x=ml+10+k*130;s+=`<rect x="${x}" y="10" width="14" height="14" fill="${CASE_COLORS[k]}" rx="2"/><text x="${x+20}" y="22" font-size="12.5" fill="#1D2330">${esc(se.name)}</text>`})}
 s+=`<text x="${W-mr}" y="${H-8}" text-anchor="end" font-size="11" fill="#666">기간: ${esc(d.period)}</text></svg>`;
 return s;
}

function lineChart(id){
 const d=chartData(id);const W=640,H=330,ml=50,mr=20,mt=46,mb=46,ph=H-mt-mb,pw=W-ml-mr;
 const all=d.series.flatMap(s=>s.values);const mn=Math.floor(Math.min(0,...all)/5)*5,mx=Math.ceil(Math.max(...all)/5)*5+5;
 const y=v=>mt+ph*(1-(v-mn)/(mx-mn)),x=i=>ml+pw*(i+.5)/d.labels.length;
 let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(d.title)}" style="width:100%;height:auto;display:block" font-family="${SVGF}"><rect width="${W}" height="${H}" fill="#fff"/>`;
 for(let v=mn;v<=mx;v+=5){s+=`<line x1="${ml}" x2="${W-mr}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?'#777':'#E2E4DE'}"/><text x="${ml-8}" y="${y(v)+4}" font-size="12" text-anchor="end" fill="#555">${v}</text>`}
 s+=`<text x="${ml-8}" y="${mt-14}" text-anchor="end" font-size="12" font-weight="700" fill="#333">(℃)</text>`;
 s+=`<line x1="${ml}" x2="${W-mr}" y1="${y(10)}" y2="${y(10)}" stroke="#C0533A" stroke-width="2" stroke-dasharray="7 5"/><text x="${W-mr}" y="${y(10)-6}" font-size="12" text-anchor="end" fill="#9C3A26" font-weight="700">10℃</text>`;
 d.labels.forEach((l,i)=>{s+=`<text x="${x(i)}" y="${H-mb+20}" font-size="12.5" text-anchor="middle" fill="#1D2330">${l}</text>`});
 const cols=['#C9781E','#2F5D8A'];
 d.series.forEach((se,k)=>{s+=`<path d="${se.values.map((v,i)=>(i?'L':'M')+x(i)+' '+y(v)).join('')}" fill="none" stroke="${cols[k]}" stroke-width="3"/>`;se.values.forEach((v,i)=>{s+=`<circle cx="${x(i)}" cy="${y(v)}" r="4.5" fill="${cols[k]}"/><text x="${x(i)}" y="${y(v)+(k?17:-9)}" font-size="10.5" text-anchor="middle" fill="${cols[k]}">${v}</text>`});const lx=ml+10+k*110;s+=`<rect x="${lx}" y="14" width="16" height="4" fill="${cols[k]}"/><text x="${lx+22}" y="20" font-size="13" fill="#1D2330">${esc(se.name)}</text>`});
 return s+`<text x="${W-mr}" y="${H-8}" text-anchor="end" font-size="11" fill="#666">기간: ${esc(d.period)}</text></svg>`;
}
function chartSVG(id,hl){return id==='monthly'?lineChart(id):barChart(id,hl)}

 return `<div id="tphotos">${photoSlots().map(([k,l])=>{const p=CFG.photos[k]||{};return `<div class="tphoto"><div>${p.src?`<img src="${p.src}" alt="">`:'<div class="ph"></div>'}</div><div><b class="small">${esc(l)}</b><div class="field-row" style="margin:4px 0"><label class="btn small ghost">사진 고르기<input type="file" accept="image/*" data-tphoto="${k}" hidden></label>${p.src?`<button type="button" class="btn small warn" data-act="tphotoDel" data-k="${k}">빼기</button>`:''}</div><input type="text" data-tpk="${k}|caption" value="${esc(p.caption||'')}" placeholder="사진 설명" style="margin-bottom:4px"><input type="text" data-tpk="${k}|source" value="${esc(p.source||'')}" placeholder="출처(기관, 언론사, 날짜, 촬영자)"></div></div>`}).join('')}</div>

function caseHeader(c){return `<div class="case-head"><span class="ic">${caseImg(c.id)}</span><div><div class="sub">${c.code} / ${c.region}</div><h1>${esc(c.title)}</h1></div><div class="tools"><button type="button" class="btn small ghost" data-act="open" data-case="${c.id}">사건 개요 보기</button><div><label class="small muted" for="sw">다른 사건 보기</label><br><select id="sw" data-act-change="switch">${ORDER.map(id=>`<option value="${id}" ${id===c.id?'selected':''}>${CASES[id].code} ${CASES[id].region}</option>`).join('')}</select></div></div></div>`}
function navbar(prev,next,count){return `<div class="navbar"><div>${prev?`<button type="button" class="btn ghost" data-act="step" data-step="${prev[0]}">${prev[1]}</button>`:''}</div>${count?`<div class="count">필수 항목 <b id="cnt">${count[0]}</b> / ${count[1]} 작성</div>`:''}<div>${next?`<button type="button" class="btn" data-act="step" data-step="${next[0]}">${next[1]}</button>`:''}</div></div>`}
function viewClue(c,n){const cl=c.clues[n-1];const r=req(c.id);const list=matList(c,n);
 const hasChart=list.some(x=>x.m.t==='chart');let k=0;
 const mats=list.map(({m,info})=>{if(info.memo)return `<div class="memo"><b>${esc(info.title)}</b> <span class="small muted">밑줄 친 낱말을 누르면 뜻을 볼 수 있어요.</span><div style="margin-top:6px">${info.art}</div></div>`;k++;return figBox('자료 '+k,info.title,info.art,info.cap?`<p>${info.cap}</p>`:'',info.src,info.period,info.unit,info.bdg,m.look||info.look,info.teach?teacherEditor(info.teach):'',info.two)}).join('');
 const prev=n===1?null:['c'+(n-1),'단서 '+(n-1)+'로'];const next=n<NCL?['c'+(n+1),'다음: 단서 '+(n+1)]:['solve','다음: 사건 해결'];
 return `${caseHeader(c)}<div class="step-title"><h2>단서 ${n}. ${esc(cl.title)}</h2></div>
 <div class="recap" style="margin-bottom:16px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px"><b>학습 내용</b><span>${esc(cl.learn)}</span><b>탐정 활동</b><span>${esc(cl.act)}</span></div>
 <div class="split"><div><div class="colhead m">제시 자료</div><div class="mat">${hasChart?GUIDE:''}${mats}</div></div>
 <aside class="notes" aria-label="수사 노트"><div class="colhead n">우리 모둠 수사 노트</div>${cl.qs.map(q=>noteQ(q,`cases.${c.id}.cl.${n}`)).join('')}</aside></div>
 ${navbar(prev,next,r['c'+n])}`}
function recap(c,st){let h='';c.clues.forEach((cl,i)=>{const n=i+1;const a=cl.qs.filter(q=>filled(st.cl[n][q.k])).map(q=>`<p><b>${esc(q.t)}</b><br>${nl(st.cl[n][q.k])}</p>`).join('');h+=`<div class="recap" style="margin-bottom:12px"><h3>단서 ${n}. ${esc(cl.title)}</h3>${a||'<p class="empty">아직 작성한 내용이 없어요.</p>'}</div>`});return h}
function viewSolve(c){const st=C(c.id);const r=req(c.id);
 return `${caseHeader(c)}<div class="step-title"><h2>사건 해결: 단서를 연결해 원인을 추론하라</h2><span class="muted">핵심 질문: ${esc(c.question)}</span></div>
 <div class="split"><div><div class="colhead m">지금까지의 수사 기록</div>${recap(c,st)}</div>
 <aside class="notes"><div class="colhead n">탐정의 추리</div>${SOLVE.map(q=>noteQ(q,`cases.${c.id}.solve`)).join('')}</aside></div>
 ${navbar(['c4','단서 4로'],['file','다음: 수사 파일 저장'],r.solve)}`}
function clueItems(cid){const c=CASES[cid];const a=[];c.clues.forEach((cl,i)=>{const n=i+1;let k=0;cl.mats.forEach((m,j)=>{const info=matInfo(c,m,true);if(!info)return;if(info.memo){a.push([`${n}_${j}`,n,`${info.title}`]);return}k++;a.push([`${n}_${j}`,n,`자료 ${k}. ${info.title}`])})});return a}

  <div class="recap" style="margin-top:14px"><h3>수사 파일에 넣을 단서 고르기</h3><p class="small muted" style="margin-top:0">고른 자료가 있는 단서마다 한 쪽씩, 그 단서에서 모둠이 쓴 글과 함께 실립니다.</p>

  <div class="recap" style="margin-top:14px"><div class="field-row"><button type="button" class="btn ghost" data-act="preview">수사 파일 미리보기</button><button type="button" class="btn" data-act="pdf" id="pdfBtn">PDF로 저장하기</button></div>

 <div id="previewBox"></div>
 ${navbar(['solve','사건 해결로'],['compare','사건 비교 회의'])}`}

 return `<h1>사건 비교 회의</h1><p class="small muted">각 모둠의 발표를 듣고 네 사건을 비교해 정리하세요. 우리 모둠이 조사한 사건은 기록이 회색 글씨로 함께 보입니다.</p>

 const head=`<div class="r-cover" style="padding:16px 18px"><div class="r-cover-top">기후변화 탐정 수사 파일 / 지역마다 기후변화의 영향은 왜 다르게 나타날까?</div>
 <div style="display:flex;gap:16px;margin-top:12px;align-items:stretch"><div class="r-cv-img" style="flex:0 0 170px;height:128px">${cp?`<img src="${cp.src}" alt="" style="object-position:${cp.pos||'50% 50%'}">`:icon(cid)}</div><div style="flex:1;min-width:0"><div class="r-cover-no" style="margin-top:0">${c.code} / ${esc(c.region)}</div><h1 style="font-size:26px;margin:2px 0 8px">${esc(c.title)}</h1><table class="r-meta"><tr><th>모둠명</th><td>${esc(S.group||'')}</td><th>작성일</th><td>${ds}</td></tr><tr><th>모둠원</th><td colspan="3">${esc(S.members||'')}</td></tr></table></div></div>${cp&&cp.source?`<div style="font-size:9px;color:#666;margin-top:3px">사진 출처: ${esc(cp.source)}</div>`:''}</div>
 <div class="r-ans key" style="margin-top:12px"><div class="l">밝혀야 할 핵심 질문</div><div>${esc(c.question)}</div></div>`;
 const partA=`<h2 style="margin-top:12px">사건 해결: 탐정의 최종 추리</h2>`+rAns(SOLVE[0].t,s.trait)+rAns(SOLVE[1].t,s.evidence);
 const partB=rAns(SOLVE[2].t,s.reasoning,'key')+rAns(SOLVE[3].t,s.response)+rAns(SOLVE[4].t,s.limits);
 return two?[head+partA,rHead(c,'사건 해결(이어서)')+partB]:[head+partA+partB]}
function cluePages(cid){const c=CASES[cid];const st=C(cid);const pages=[];
 c.clues.forEach((cl,i)=>{const n=i+1;let k=0;const figs=[];cl.mats.forEach((m,j)=>{const info=matInfo(c,m,true);if(!info)return;if(!info.memo)k++;if(!st.pick[`${n}_${j}`])return;
   if(info.memo)figs.push([1,`<div class="r-mat"><div class="l">${esc(info.title)}(제시 자료)</div>${info.art}</div>`]);
   else figs.push([info.wide,rFig(`자료 ${k}. ${info.title}`,info.art,info.src,info.period,info.unit,info.bdg,info.cap&&m.t!=='chart'&&m.t!=='prof'?info.cap:'')])});
  if(!figs.length)return;
  pages.push(rHead(c,`단서 ${n}`)+`<h2>단서 ${n}. ${esc(cl.title)}</h2><p class="r-legend" style="display:block">탐정 활동: ${esc(cl.act)}</p><div class="r-grid" style="align-items:start">${figs.map(f=>`<div${f[0]?' style="grid-column:1/-1"':''}>${f[1]}</div>`).join('')}</div><h3>모둠의 수사 노트</h3>${cl.qs.map(q=>rAns(q.t,st.cl[n][q.k])).join('')}`)});
 return pages}
function buildPages(cid,host,two){return reportPages(cid,two).map(h=>{const d=document.createElement('div');d.className='pg';d.innerHTML=`<div class="pg-in">${h}</div><div class="pg-foot"><span></span><span></span></div>`;host.appendChild(d);return d})}
async function makePages(cid,host,img){
 let els=buildPages(cid,host,false);if(img)await svgToImg(els[0]);const sc=fitPage(els[0]);
 if(sc<0.85){els.forEach(e=>e.remove());els=buildPages(cid,host,true);for(const e of els){if(img)await svgToImg(e);fitPage(e)}}
 for(const h of cluePages(cid)){const d=document.createElement('div');d.className='pg';d.innerHTML=`<div class="pg-in">${h}</div><div class="pg-foot"><span></span><span></span></div>`;host.appendChild(d);if(img)await svgToImg(d);fitPage(d);els.push(d)}
 const n=els.length;els.forEach((d,i)=>{const sp=d.querySelectorAll('.pg-foot span');sp[0].textContent=`기후변화 탐정 수사 파일 / ${CASES[cid].code} ${CASES[cid].region} / ${S.group||''}`;sp[1].textContent=`${i+1} / ${n}`});
 return els}
function fitPage(pg){const inn=pg.querySelector('.pg-in');const AW=793-76,AH=1118-34-52;let s=1;for(let i=0;i<10;i++){inn.style.width=(AW/s)+'px';inn.style.transform=s<1?`scale(${s})`:'';const h=inn.offsetHeight;if(h*s<=AH+0.5)break;s=Math.max(0.3,s*Math.sqrt(AH/(h*s))*0.99)}return s}

async function svgToImg(el){const loads=[];el.querySelectorAll('svg').forEach(svg=>{if(svg.closest('svg')!==svg)return;const r=svg.getBoundingClientRect();const vb=(svg.getAttribute('viewBox')||'0 0 100 100').split(/\s+/).map(Number);const w=r.width||vb[2],h=r.height||(w*vb[3]/vb[2]);const cl=svg.cloneNode(true);cl.setAttribute('width',vb[2]);cl.setAttribute('height',vb[3]);cl.removeAttribute('style');const img=new Image();img.alt='';img.style.cssText=`width:${w}px;height:${h}px;display:block;max-width:100%`;loads.push(new Promise(res=>{img.onload=res;img.onerror=res}));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(cl));svg.replaceWith(img)});await Promise.all(loads)}

let DL=null;
try{if(window.claude&&typeof window.claude.use==='function')window.claude.use('downloads').then(n=>{DL=n}).catch(()=>{})}catch(e){}
function setStatus(m){const el=$('#pdfStatus');if(el)el.textContent=m}
async function buildPDF(cid,scale){
 const stage=$('#pdfStage');stage.innerHTML='';const els=await makePages(cid,stage,true);
 const opt={margin:0,image:{type:'jpeg',quality:0.93},html2canvas:{scale:scale,useCORS:true,backgroundColor:'#ffffff',logging:false,scrollX:0,scrollY:0},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css']}};
 let w=window.html2pdf().set(opt).from(els[0]).toPdf();
 for(let i=1;i<els.length;i++){const el=els[i];w=w.get('pdf').then(p=>{p.addPage()}).from(el).toContainer().toCanvas().toPdf()}
 const blob=await w.get('pdf').then(pdf=>{const n=pdf.internal.getNumberOfPages();for(let i=n;i>els.length;i--)pdf.deletePage(i)}).outputPdf('blob');
 stage.innerHTML='';return blob;
}
async function makePDF(){
 const cid=S.view.cid;if(!cid)return;const c=CASES[cid];const btn=$('#pdfBtn');
 if(!window.html2pdf){setStatus('PDF 도구를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해 주세요.');return}
 saveNow();btn.disabled=true;setStatus('수사 파일을 PDF로 만드는 중입니다. 20~30초 정도 걸릴 수 있어요.');
 try{if(document.fonts&&document.fonts.ready)await document.fonts.ready}catch(e){}
 let blob=null;
 try{blob=await buildPDF(cid,2)}catch(e){try{blob=await buildPDF(cid,1.3)}catch(e2){setStatus('PDF를 만들지 못했습니다. 다시 시도해 주세요.');btn.disabled=false;return}}
 const name=fileName(c);
 if(!DL&&window.claude&&typeof window.claude.use==='function'){try{DL=await window.claude.use('downloads')}catch(e){DL=null}}
 if(DL){try{await DL.save({filename:name,data:blob});setStatus('PDF로 저장했습니다: '+name)}catch(e){const code=e&&e.code;setStatus(code==='declined'?'저장을 취소했습니다. 다시 누르면 저장할 수 있어요.':code==='rate_limited'?'이미 저장 창이 열려 있어요. 잠시 후 다시 시도해 주세요.':'저장하지 못했습니다('+(code||'알 수 없는 오류')+'). 다시 시도해 주세요.')}}
 else{try{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),8000);setStatus('PDF 파일을 내려받았습니다: '+name)}catch(e){setStatus('이 화면에서는 파일을 내려받을 수 없습니다. claude.ai에서 이 페이지를 열어 다시 시도해 주세요.')}}
 btn.disabled=false;
}
async function showPreview(){const cid=S.view.cid;const box=$('#previewBox');if(!box)return;
 box.innerHTML='<div class="preview" aria-label="수사 파일 미리보기"></div><p class="small muted">미리보기는 PDF와 같은 A4 쪽 구성입니다.</p>';const host=box.querySelector('.preview');
 try{if(document.fonts&&document.fonts.ready)await document.fonts.ready}catch(e){}
 await makePages(cid,host,false);if(box.scrollIntoView)box.scrollIntoView({behavior:'smooth',block:'start'})}

/* ---------- 교사 사진: 페이지 새 버전 게시 ---------- */
function buildSelfHTML(){const css=document.getElementById('appcss').textContent;const js=document.getElementById('appjs').textContent;const cfg=JSON.stringify(CFG).replace(/</g,'\\u003c');
 return `<!doctype html>\n<html lang="ko">\n<head>\n${HEAD_HTML}\n<style id="appcss">${css}</style>\n</head>\n<body>\n<script id="cfg" type="application/json">${cfg}<\/script>\n<script src="${LIB_SRC}"><\/script>\n<script id="appjs">${js}<\/script>\n</body>\n</html>\n`}
async function publishPhotos(){const out=$('#tpStatus');const say=m=>{if(out)out.textContent=m};
 let art=null;try{art=window.claude&&typeof window.claude.use==='function'?await window.claude.use('artifact'):null}catch(e){art=null}
 if(!art){say('이 화면에서는 페이지를 고칠 수 없습니다. claude.ai에서 이 자료를 만든 계정으로 열어 주세요.');return}
 say('새 버전을 게시하는 중입니다…');
 try{await art.publish(buildSelfHTML());say('게시했습니다. 잠시 뒤 모든 화면이 새 버전으로 바뀝니다.')}catch(e){const c=e&&e.code;say(c==='not_writer'||c==='not_granted'?'편집 권한이 있는 계정에서만 사진을 바꿀 수 있습니다.':c==='conflict'?'다른 곳에서 먼저 바뀌어 새 버전을 불러옵니다. 다시 시도해 주세요.':'게시하지 못했습니다('+(c||'오류')+').')}}
function compress(file,max){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(img,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',0.82))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

/* ---------- 렌더링과 이동 ---------- */
const app=$('#app');
function render(keep){const y=window.scrollY;const v=S.view;let h='';
 if(v.name==='home')h=viewHome();else if(v.name==='compare')h=viewCompare();
 else{const c=CASES[v.cid];if(!c){S.view={name:'home'};return render()}const stp=v.step||'c1';h=/^c[1-4]$/.test(stp)?viewClue(c,+stp[1]):stp==='solve'?viewSolve(c):viewFile(c)}
 app.innerHTML=h;renderTrack();if(keep)window.scrollTo(0,y);else window.scrollTo(0,0)}
function go(name,cid,step){if(name==='case')S.view={name:'case',cid:cid,step:step||'c1'};else S.view={name:name,cid:S.view.cid};save();closeModal();render()}
function updateLive(k){const cid=S.view.cid;
 if(k.indexOf('lapse')>-1){const r=lapseCalc(C('D'));const o=$('#lapseOut');if(o)o.textContent=lapseText(r);const lv=$('#laV');if(lv)lv.textContent=r.alt}
 if(cid&&S.view.name==='case'){const r=req(cid);const m=r[S.view.step];const ce=$('#cnt');if(ce&&m)ce.textContent=m[0];renderTrack()}}
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.k&&t.type!=='checkbox'&&t.type!=='radio'&&t.tagName!=='SELECT'){setP(S,t.dataset.k,t.value);save();updateLive(t.dataset.k)}
 else if(t.dataset.tpk){const [k,f]=t.dataset.tpk.split('|');CFG.photos[k]=CFG.photos[k]||{};CFG.photos[k][f]=t.value}});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.dataset.k&&(t.type==='checkbox'||t.tagName==='SELECT')){setP(S,t.dataset.k,t.type==='checkbox'?t.checked:t.value);save();updateLive(t.dataset.k);if(t.dataset.k==='home'){if(t.value)openModal(t.value);else render(true)}}
 else if(t.dataset.actChange==='switch')go('case',t.value,S.view.step);
 else if(t.dataset.tk){const [id,key]=t.dataset.tk.split('|');TD[id]=TD[id]||{};TD[id][key]=t.value;lsSet(LS+'::teacher',JSON.stringify(TD));render(true);toast('그래프 수치를 고쳤습니다.')}
 else if(t.dataset.tphoto&&t.files&&t.files[0]){const k=t.dataset.tphoto;try{const src=await compress(t.files[0],1400);CFG.photos[k]=Object.assign(CFG.photos[k]||{},{src:src});render(true);const d=document.querySelector('details.panel');if(d)d.open=true;toast('사진을 넣었습니다. 아래 ‘모든 학생 화면에 반영하기’를 눌러야 저장됩니다.')}catch(err){toast('사진을 읽지 못했습니다.')}}});
function act(el){const a=el.dataset.act;const cid=S.view.cid;
 if(a==='home')return go('home');
 if(a==='compare')return go('compare');
 if(a==='open')return openModal(el.dataset.case);
 if(a==='closeModal')return closeModal();
 if(a==='startCase')return go('case',el.dataset.case,'c1');
 if(a==='step'){const s=el.dataset.step;if(s==='home')return go('home');if(s==='compare')return go('compare');if(!cid)return;return go('case',cid,s)}
 if(a==='frame'){const ta=document.getElementById(el.dataset.target);if(!ta)return;const f=el.dataset.f;ta.value=filled(ta.value)?ta.value.replace(/\s+$/,'')+'\n'+f:f;ta.dispatchEvent(new Event('input',{bubbles:true}));ta.focus();const i=ta.value.lastIndexOf(f)+f.indexOf('______');if(i>=0&&ta.setSelectionRange)ta.setSelectionRange(i,i+6);return}
 if(a==='setTeam'){const n=($('#teamName').value||'').trim();if(!n){toast('모둠 이름을 입력해 주세요.');return}saveNow();const exists=lsGet(teamKey(n));const old=S;loadTeam(n);
  if(!exists&&old&&old.group===''&&Object.keys(old.cases||{}).length){S=Object.assign(old,{group:n});lsDel(teamKey(''))}
  lsSet(KEY_CUR,n);saveNow();render(true);toast(exists?`‘${n}’ 모둠의 기록을 불러왔습니다.`:`‘${n}’ 모둠으로 수사를 시작합니다.`);return}
 if(a==='wipe'){if(confirm('이 모둠의 모든 기록을 지울까요? 되돌릴 수 없습니다.')){lsDel(teamKey(S.group));loadTeam(S.group);render();toast('기록을 지웠습니다.')}return}
 if(a==='pickAll'||a==='pickNone'){const st=C(cid);st.pick={};if(a==='pickAll')clueItems(cid).forEach(x=>st.pick[x[0]]=true);save();render(true);return}
 if(a==='lapseReset'){const c=C('D');c.c1.lapse={base:'30',alt:'800'};save();render(true);return}
 if(a==='resetChart'){delete TD[el.dataset.id];lsSet(LS+'::teacher',JSON.stringify(TD));render(true);return}
 if(a==='tphotoDel'){delete CFG.photos[el.dataset.k];render(true);const d=document.querySelector('details.panel');if(d)d.open=true;return}
 if(a==='tphotoPublish')return publishPhotos();
 if(a==='preview')return showPreview();
 if(a==='pdf')return makePDF();
}
document.addEventListener('click',e=>{const term=e.target.closest('.term');const pop=$('#pop');
 if(term){e.preventDefault();const r=term.getBoundingClientRect();pop.innerHTML=`<b>${esc(term.dataset.term)}</b>${esc(GLOSS[term.dataset.term]||'')}`;pop.style.display='block';const pw=Math.min(300,window.innerWidth-20);pop.style.left=Math.max(10,Math.min(r.left,window.innerWidth-pw-10))+'px';pop.style.top=(r.bottom+8+(r.bottom+150>window.innerHeight?-(160+r.height):0))+'px';return}
 pop.style.display='none';
 const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
 if(el.dataset.act==='closeModal'&&el.classList.contains('modal-back')&&e.target!==el)return;
 act(el)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('role')==='button'&&e.target.dataset.act){e.preventDefault();act(e.target)}if(e.key==='Escape'){$('#pop').style.display='none';closeModal()}});
window.addEventListener('pagehide',saveNow);
render();
})();
